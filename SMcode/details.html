<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details - StudentMarket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      background-color: #eef6f6;
      font-family: Arial, sans-serif;
    }

    .custom-navbar {
      background-color: #006666;
      padding: 15px;
    }

    .navbar-brand,
    .nav-link {
      color: white !important;
    }

    .nav-link:hover {
      color: #00ffff !important;
    }

    .btn-main {
      background-color: #00ffff;
      color: #003333;
      border-radius: 10px;
      font-weight: bold;
      padding: 8px 18px;
      border: none;
    }

    .details-image-box {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .details-image-box img {
      width: 100%;
      height: 430px;
      object-fit: cover;
    }

    .details-card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      padding: 30px;
    }

    .details-category {
      color: #006666;
      font-weight: 700;
      text-transform: capitalize;
    }

    .form-error {
      color: #b00020;
      font-weight: 600;
      font-size: 0.9rem;
      display: none;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">StudentMarket</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="my-orders.html">My Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="provider.html">Provider Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="myaccount.html">My Account</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENT (filled in by js/details.js once we know which item this is) -->
<div class="container my-5" id="content-area">
  <p class="text-center text-muted">Loading...</p>
</div>

<!-- ORDER MODAL -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: 16px;">

      <div class="modal-header">
        <h5 class="modal-title">Bëj një Porosi</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form id="orderForm" novalidate>
        <div class="modal-body">

          <p class="text-muted mb-3">Duke porositur si: <strong id="orderingAs"></strong></p>

          <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="date" class="form-control" id="orderDate">
            <div class="form-error" id="err-date">Ju lutem zgjidhni një datë.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Mesazh</label>
            <textarea class="form-control" id="orderMessage" rows="3"></textarea>
            <div class="form-error" id="err-message">Ju lutem shkruani një mesazh.</div>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anulo</button>
          <button type="submit" class="btn btn-main">Dërgo Porosinë</button>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/details.js"></script>

</body>
</html>
