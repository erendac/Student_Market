<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account - StudentMarket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef6f6;
    }

    .custom-navbar {
      background: #006666;
      padding: 18px 0;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      border-bottom: 2px solid rgba(0,255,255,0.15);
    }

    .navbar-brand {
      font-size: 1.6rem;
      color: #ffffff !important;
      letter-spacing: 1px;
    }

    .nav-link {
      color: rgba(255,255,255,0.75) !important;
      font-weight: 500;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #ffffff !important;
    }

    .btn-main {
      background: #00ffff;
      color: #003333;
      font-weight: 700;
      padding: 9px 22px;
      border-radius: 12px;
      border: none;
    }

    .account-header {
      background: linear-gradient(135deg, #006666, #009999);
      padding: 70px 0 100px;
      text-align: center;
    }

    .account-header h1 {
      color: #ffffff;
      font-weight: 800;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .account-header p {
      color: rgba(255,255,255,0.9);
      margin: 0;
    }

    .account-card {
      max-width: 640px;
      margin: -70px auto 60px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      padding: 40px;
      position: relative;
    }

    .account-avatar-wrap {
      text-align: center;
      margin-top: -90px;
      margin-bottom: 20px;
    }

    .account-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      background: #eef6f6;
    }

    .account-name {
      text-align: center;
      color: #003333;
      font-weight: 700;
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .account-email {
      text-align: center;
      color: #6b7d7d;
      margin-bottom: 30px;
    }

    .account-divider {
      border: none;
      border-top: 1px solid #e9efef;
      margin: 25px 0;
    }

    .account-info-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
    }

    .account-info-icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 12px;
      background: #dff5ee;
      color: #0d6b57;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .account-info-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #0d6b57;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .account-info-value {
      color: #003333;
      font-weight: 600;
    }

    .account-actions {
      margin-top: 30px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-outline-account {
      border: 2px solid #006666;
      color: #006666;
      font-weight: 700;
      border-radius: 12px;
      padding: 10px 22px;
      background: transparent;
      text-decoration: none;
    }

    .btn-outline-account:hover {
      background: #006666;
      color: #ffffff;
    }

    .btn-logout {
      border: 2px solid #b00020;
      color: #b00020;
      font-weight: 700;
      border-radius: 12px;
      padding: 10px 22px;
      background: transparent;
    }

    .btn-logout:hover {
      background: #b00020;
      color: #ffffff;
    }

  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">StudentMarket</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="my-orders.html">My Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="provider.html">Provider Panel</a></li>
        <li class="nav-item"><a class="nav-link active" href="myaccount.html">My Account</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="account-header">
  <h1>My Account</h1>
  <p>Manage your StudentMarket profile</p>
</div>

<div class="container">
  <div class="account-card">

    <div class="account-avatar-wrap">
      <img src="images/profile.png" alt="Profile Picture" class="account-avatar">
    </div>

    <h3 class="account-name" id="username">-</h3>
    <p class="account-email" id="email">-</p>

    <hr class="account-divider">

    <div class="account-info-row">
      <div class="account-info-icon"><i class="bi bi-mortarboard-fill"></i></div>
      <div>
        <div class="account-info-label">School</div>
        <div class="account-info-value" id="school">-</div>
      </div>
    </div>

    <hr class="account-divider">

    <div class="account-actions">
      <a href="my-orders.html" class="btn btn-main"><i class="bi bi-box-seam me-1"></i> My Orders</a>
      <button class="btn btn-logout" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i> Log Out</button>
    </div>

  </div>
</div>

<script>

  // Require login: if no one is signed in, send them to login.html
  const username = localStorage.getItem("username");
  const email = localStorage.getItem("email");
  const school = localStorage.getItem("school");

  if (!email) {
    window.location.href = "login.html";
  } else {
    document.getElementById("username").textContent = username || "Guest User";
    document.getElementById("email").textContent = email;
    document.getElementById("school").textContent = school || "Not set";
  }

  document.getElementById("logoutBtn").addEventListener("click", function () {
    localStorage.removeItem("username");
    localStorage.removeItem("email");
    localStorage.removeItem("school");
    window.location.href = "login.html";
  });

</script>

<footer class="bg-dark text-white py-4">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h5>StudentMarket</h5>
        <p>Connecting students through services and opportunities.</p>
      </div>
      <div class="col-md-6 text-md-end">
        <a href="#" class="text-white me-3"><i class="bi bi-facebook"></i></a>
        <a href="#" class="text-white me-3"><i class="bi bi-instagram"></i></a>
        <a href="#" class="text-white"><i class="bi bi-envelope-fill"></i></a>
      </div>
    </div>
    <hr>
    <p class="text-center mb-0">© 2026 StudentMarket. All rights reserved.</p>
  </div>
</footer>
</body>
</html>
