<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - StudentMarket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      background-color: #eef6f6;
      font-family: Arial, sans-serif;
    }

    .custom-navbar {
      background-color: #006666;
      padding: 15px;
    }

    .navbar-brand,
    .nav-link {
      color: white !important;
    }

    .nav-link:hover {
      color: #00ffff !important;
    }

    .btn-main {
      background-color: #00ffff;
      color: #003333;
      border-radius: 10px;
      font-weight: bold;
      border: none;
      width: 100%;
      padding: 10px;
    }

    .auth-card {
      max-width: 440px;
      margin: 60px auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      padding: 36px;
    }

    .auth-card h2 {
      color: #003333;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .auth-card p.sub {
      color: #6b7d7d;
      margin-bottom: 24px;
    }

    .form-error {
      color: #b00020;
      font-weight: 600;
      font-size: 0.9rem;
      display: none;
    }

    .switch-link {
      text-align: center;
      margin-top: 18px;
      color: #6b7d7d;
    }

    .switch-link a {
      color: #006666;
      font-weight: 700;
      text-decoration: none;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">StudentMarket</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="my-orders.html">My Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="provider.html">Provider Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="myaccount.html">My Account</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="auth-card">

    <h2>Log In</h2>
    <p class="sub">Log in to continue with your orders.</p>

    <form id="loginForm" novalidate>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="loginEmail">
        <div class="form-error" id="err-email">Please enter your email.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword">
        <div class="form-error" id="err-password">Please enter your password.</div>
      </div>

      <div class="form-error" id="err-invalid">Incorrect email or password.</div>

      <button type="submit" class="btn btn-main mt-2">Log In</button>

    </form>

    <p class="switch-link">Don't have an account? <a href="signup.html">Sign up here</a></p>

  </div>
</div>

<script>

  document.getElementById("loginForm").addEventListener("submit", function (e) {

    e.preventDefault();

    const emailEl = document.getElementById("loginEmail");
    const passwordEl = document.getElementById("loginPassword");

    function show(id, isValid) {
      document.getElementById(id).style.display = isValid ? "none" : "block";
      return isValid;
    }

    document.getElementById("err-invalid").style.display = "none";

    let valid = true;
    valid = show("err-email", emailEl.value.trim() !== "") && valid;
    valid = show("err-password", passwordEl.value.trim() !== "") && valid;

    if (!valid) return;

    const users = JSON.parse(localStorage.getItem("users")) || [];
    const email = emailEl.value.trim().toLowerCase();

    const match = users.find(function (u) {
      return u.email === email && u.password === passwordEl.value;
    });

    if (!match) {
      document.getElementById("err-invalid").style.display = "block";
      return;
    }

    localStorage.setItem("username", match.username);
    localStorage.setItem("email", match.email);
    localStorage.setItem("school", match.school);

    window.location.href = "myaccount.html";

  });

</script>

</body>
</html>
